name: Automações Python

on:
  schedule:
    - cron: '0 11 * * *'     # todo dia, 08:00 em Brasília: alertas
    - cron: '15 */3 * * *'   # a cada 3 horas: triagem de solicitações
    - cron: '0 12 1 * *'     # dia 1 de cada mês: relatório do mês anterior
  workflow_dispatch:
    inputs:
      tarefa:
        description: Tarefa a executar
        type: choice
        options: [alerts, triage, report]

defaults:
  run:
    working-directory: python

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  AI_PROVIDER: ${{ vars.AI_PROVIDER }}
  AI_API_KEY: ${{ secrets.AI_API_KEY }}
  AI_MODEL: ${{ vars.AI_MODEL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  MAIL_FROM: ${{ secrets.MAIL_FROM }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r requirements.txt

      - name: Definir tarefa
        id: tarefa
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            schedule:'0 11 * * *')   echo "nome=alerts" >> "$GITHUB_OUTPUT" ;;
            schedule:'15 */3 * * *') echo "nome=triage" >> "$GITHUB_OUTPUT" ;;
            schedule:'0 12 1 * *')   echo "nome=report" >> "$GITHUB_OUTPUT" ;;
            *)                       echo "nome=${{ inputs.tarefa }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Executar
        run: |
          case "${{ steps.tarefa.outputs.nome }}" in
            triage) if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$AI_API_KEY" ]; then echo "Nenhuma chave de IA configurada (AI_API_KEY ou ANTHROPIC_API_KEY): triagem ignorada."; else python -m carcara triage; fi ;;
            report) python -m carcara report --email ;;
            *)      python -m carcara ${{ steps.tarefa.outputs.nome }} ;;
          esac
