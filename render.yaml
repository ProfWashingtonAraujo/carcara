services:
  - type: web
    name: carcara
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # connection string do Neon
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # Diagnóstico de sites (Python/FastAPI): página em / e API em POST /diagnostico
  - type: web
    name: carcara-diagnostico
    runtime: python
    rootDir: python
    plan: free
    buildCommand: pip install -r requirements-service.txt
    startCommand: uvicorn carcara.service:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CORS_ORIGINS
        value: https://www.carcaratech.com.br,https://carcara-tech.vercel.app
